<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaMundo - Entrar ou Cadastrar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { color: #007bff; font-size: 28px; margin-bottom: 20px; font-weight: bold; }
        h3 { margin-bottom: 20px; color: #333; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #565656; font-weight: bold; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .btn-submit { background-color: #007bff; color: white; border: none; width: 100%; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0056b3; }
        .toggle-form { margin-top: 20px; font-size: 14px; color: #666; }
        .toggle-form a { color: #007bff; text-decoration: none; font-weight: bold; }
        .toggle-form a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">🌍 EducaMundo</div>
        
        <!-- Formulário de Cadastro -->
        <div id="cadastro-box">
            <h3>Criar Nova Conta</h3>
            <form onsubmit="registrarUsuario(event)">
                <div class="form-group">
                    <label for="reg-nome">Nome Completo</label>
                    <input type="text" id="reg-nome" required placeholder="Ex: Maria Souza">
                </div>
                <div class="form-group">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="reg-tipo">Você é:</label>
                    <select id="reg-tipo">
                        <option value="Aluno">Aluno (Quero aprender)</option>
                        <option value="Professor">Professor (Quero ensinar)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reg-idioma">Seu Idioma Nativo:</label>
                    <select id="reg-idioma">
                        <option value="Português (Brasil)">Português (Brasil)</option>
                        <option value="English (EUA/UK)">English (EUA/UK)</option>
                        <option value="Español">Español</option>
                        <option value="Français">Français</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Cadastrar de Verdade</button>
            </form>
            <div class="toggle-form">
                Já tem uma conta? <a href="#" onclick="alternarAbas()">Entrar aqui</a>
            </div>
        </div>

        <!-- Formulário de Login -->
        <div id="login-box" style="display: none;">
            <h3>Entrar na Plataforma</h3>
            <form onsubmit="logarUsuario(event)">
                <div class="form-group">
                    <label for="log-email">E-mail Cadastrado</label>
                    <input type="email" id="log-email" required placeholder="seuemail@exemplo.com">
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <div class="toggle-form">
                Não tem conta? <a href="#" onclick="alternarAbas()">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script>
        // Links corrigidos apontando direto para a sua tabela 'perfis'
        const _URL = "https://supabase.co"; 
        const _KEY = "sb_publishable_a-9sdAnz6GT9S0v94zprQQ_wQ2AnoVw";

        function alternarAbas() {
            const cadastro = document.getElementById('cadastro-box');
            const login = document.getElementById('login-box');
            if (cadastro.style.display === 'none') {
                cadastro.style.display = 'block';
                login.style.display = 'none';
            } else {
                cadastro.style.display = 'none';
                login.style.display = 'block';
            }
        }

        // Função de Cadastro Direta e Corrigida
        async function registrarUsuario(event) {
            event.preventDefault();
            
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const tipo = document.getElementById('reg-tipo').value;
            const idioma = document.getElementById('reg-idioma').value;

            try {
                const response = await fetch(`${_URL}?apikey=${_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify([{ nome: nome, email: email, tipo: tipo, idioma: idioma }])
                });

                if (response.status === 201 || response.ok) {
                    alert("Conta salva no banco de dados com sucesso!");
                    localStorage.setItem('usuario_logado', email);
                    window.location.href = 'index.html';
                } else {
                    const errData = await response.json();
                    alert("O banco recusou o cadastro: " + errData.message);
                }
            } catch (error) {
                alert("Erro ao enviar dados. Tente recarregar o site.");
                console.error(error);
            }
        }

        // Função de Login Direta e Corrigida
        async function logarUsuario(event) {
            event.preventDefault();
            const email = document.getElementById('log-email').value;

            try {
                const response = await fetch(`${_URL}?email=eq.${email}&apikey=${_KEY}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.length === 0) {
                        alert("E-mail não encontrado! Cadastre-se primeiro.");
                    } else {
                        alert("Bem-vindo de volta!");
                        localStorage.setItem('usuario_logado', email);
                        window.location.href = 'index.html';
                    }
                } else {
                    alert("Erro ao tentar entrar.");
                }
            } catch (error) {
                alert("Erro na conexão ao tentar entrar.");
            }
        }
    </script>
</body>
</html>
