<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaMundo - Meu Perfil</title>
    <style>
        /* CSS para o Layout */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Cabeçalho do Perfil */
        .profile-header { display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #e9ecef; padding-bottom: 20px; margin-bottom: 20px; }
        .profile-avatar { width: 100px; height: 100px; background-color: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; }
        .profile-info h2 { margin: 0 0 5px 0; }
        .badge { background-color: #28a745; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }

        /* Abas / Conteúdo */
        .section-title { color: #333; border-left: 4px solid #007bff; padding-left: 10px; margin-top: 30px; }
        .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; border-radius: 6px; }
        .card h4 { margin: 0 0 10px 0; font-size: 16px; }
        
        /* Botões */
        .btn-nav { display: inline-block; background-color: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; }
        .btn-nav:hover { background-color: #5a6268; }
        .btn-action { background-color: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botão para voltar para a página inicial -->
        <a href="index.html" class="btn-nav">⬅️ Voltar para o Início</a>

        <!-- Cabeçalho do Perfil (Corrigido sem a letra d perdida) -->
        <div class="profile-header">
            <div class="profile-avatar" id="avatar-letras">JD</div>
            <div class="profile-info">
                <h2 id="nome-usuario">João Silva</h2>
                <p>Idioma Nativo: <strong id="idioma-usuario">Português (Brasil)</strong></p>
                <span class="badge">Aluno</span>
            </div>
        </div>

        <!-- Seção de Aulas Salvas -->
        <h3 class="section-title">📚 Minhas Aulas Salvas</h3>
        <div class="grid-list">
            <div class="card">
                <h4>Introdução à Inteligência Artificial</h4>
                <p style="font-size: 12px; color: #666;">Origem: EUA (Inglês)</p>
                <a href="aula.html" class="btn-action" style="text-decoration: none; display: inline-block;">Assistir Agora</a>
            </div>
        </div>

        <!-- Seção de Atividades para Impressão -->
        <h3 class="section-title">📄 Atividades para Imprimir</h3>
        <div class="grid-list">
            <div class="card">
                <h4>Exercícios - IA Básica.pdf</h4>
                <button class="btn-action" onclick="alert('Download iniciado!')">📥 Baixar PDF</button>
            </div>
        </div>

    </div>

    <script>
        console.log("Perfil carregado com sucesso!");
    </script>
</body>
</html>
